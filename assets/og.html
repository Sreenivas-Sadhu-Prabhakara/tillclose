<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #2B152F; --surface: #3D2140; --line: #593459;
    --ink: #F3E9F2; --muted: #C7A9C6; --gold: #D8AC5E; --short: #E58AA0;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: var(--sans); color: var(--ink);
    background:
      radial-gradient(1100px 600px at 84% -10%, rgba(216,172,94,0.16), transparent 60%),
      radial-gradient(820px 480px at 4% 6%, rgba(216,172,94,0.07), transparent 55%),
      linear-gradient(180deg, #24112a 0%, #2B152F 100%);
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: absolute; inset: 0; padding: 74px 84px; display: flex; flex-direction: column; justify-content: space-between; }

  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { width: 66px; height: 66px; }
  .wordmark { font-size: 60px; font-weight: 800; letter-spacing: -0.035em; }

  .mid { display: flex; align-items: center; gap: 56px; }
  .copy { max-width: 560px; }
  .copy h1 { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; }
  .copy .accent { color: var(--gold); }
  .copy p { margin-top: 20px; font-size: 27px; font-weight: 500; color: var(--muted); line-height: 1.35; max-width: 22ch; }

  /* the open drawer */
  .drawer { position: relative; width: 430px; height: 300px; flex: 0 0 auto; }
  .drawer svg { width: 430px; height: 300px; }
  .stamp {
    position: absolute; right: -14px; top: -18px;
    font-size: 27px; font-weight: 800; letter-spacing: 0.14em; color: var(--short);
    border: 3px solid var(--short); border-radius: 10px; padding: 8px 16px;
    transform: rotate(-9deg); background: rgba(43,21,47,0.5);
  }
  .total {
    position: absolute; left: 26px; bottom: 8px;
    font-size: 34px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums;
  }

  .chips { display: flex; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; padding: 11px 19px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(20,10,22,0.4);
    font-size: 22px; font-weight: 600; color: var(--muted);
  }
  .chip .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(216,172,94,0.16); }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#3D2140"/>
        <rect x="5" y="10" width="22" height="14" rx="2.5" fill="none" stroke="#D8AC5E" stroke-width="1.8"/>
        <line x1="13" y1="10" x2="13" y2="24" stroke="#D8AC5E" stroke-width="1.3"/>
        <line x1="21" y1="10" x2="21" y2="24" stroke="#D8AC5E" stroke-width="1.3"/>
        <ellipse cx="17" cy="16.5" rx="2.4" ry="1.2" fill="#D8AC5E"/>
        <ellipse cx="17" cy="19" rx="2.4" ry="1.2" fill="#D8AC5E"/>
        <ellipse cx="17" cy="21.5" rx="2.4" ry="1.2" fill="#D8AC5E"/>
      </svg>
      <span class="wordmark">tillclose</span>
    </div>

    <div class="mid">
      <div class="copy">
        <h1>Count the drawer, catch the shortage, <span class="accent">close the day.</span></h1>
        <p>Cash denomination calculator &amp; daily till-closing log.</p>
      </div>

      <div class="drawer">
        <svg viewBox="0 0 430 300" aria-hidden="true">
          <rect x="10" y="20" width="410" height="230" rx="18" fill="#3D2140" stroke="#D8AC5E" stroke-width="4"/>
          <!-- compartments -->
          <line x1="150" y1="20" x2="150" y2="250" stroke="#593459" stroke-width="3"/>
          <line x1="290" y1="20" x2="290" y2="250" stroke="#593459" stroke-width="3"/>
          <line x1="10" y1="135" x2="420" y2="135" stroke="#593459" stroke-width="3"/>
          <!-- note bundles -->
          <rect x="30"  y="42"  width="94" height="66" rx="6" fill="#D8AC5E" opacity="0.5"/>
          <rect x="40"  y="52"  width="94" height="66" rx="6" fill="#D8AC5E"/>
          <rect x="170" y="42"  width="94" height="66" rx="6" fill="#D8AC5E" opacity="0.5"/>
          <rect x="180" y="52"  width="94" height="66" rx="6" fill="#D8AC5E"/>
          <!-- coin stacks -->
          <ellipse cx="355" cy="70" rx="42" ry="15" fill="#D8AC5E"/>
          <ellipse cx="355" cy="90" rx="42" ry="15" fill="#D8AC5E"/>
          <ellipse cx="355" cy="110" rx="42" ry="15" fill="#E7C583"/>
          <ellipse cx="80"  cy="185" rx="42" ry="15" fill="#D8AC5E"/>
          <ellipse cx="80"  cy="205" rx="42" ry="15" fill="#E7C583"/>
          <ellipse cx="220" cy="190" rx="42" ry="15" fill="#D8AC5E"/>
          <ellipse cx="355" cy="185" rx="42" ry="15" fill="#D8AC5E"/>
          <ellipse cx="355" cy="205" rx="42" ry="15" fill="#E7C583"/>
        </svg>
        <span class="stamp">SHORT</span>
        <span class="total">₹21,690.00</span>
      </div>
    </div>

    <div class="chips">
      <span class="chip"><span class="dot"></span>5 currency presets</span>
      <span class="chip"><span class="dot"></span>counted vs expected</span>
      <span class="chip"><span class="dot"></span>printable close sheet</span>
      <span class="chip"><span class="dot"></span>fully offline</span>
    </div>
  </div>
</body>
</html>
